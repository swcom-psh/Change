<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강원사대부고 자리바꾸기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <aside class="sheet side-sheet">
            <div class="tape tape-blue"></div>
            <h2 class="side-title">✏️ 오늘의 자리</h2>

            <section class="step-card">
                <h3 class="step-title">① 명단 붙이기</h3>
                <label class="btn file-btn" for="csvInput">
                    📎 <span id="fileLabel">파일 선택</span>
                </label>
                <input type="file" id="csvInput" accept=".csv, .xlsx, .xls">
                <button id="templateBtn" class="btn btn-small" type="button">엑셀 양식 받기</button>
            </section>

            <section class="step-card">
                <h3 class="step-title">② 자리 정하기</h3>
                <button id="generateBtn" class="btn btn-primary">두근두근 배치! 🎲</button>
                <button id="editBtn" class="btn">자리 구조 고치기</button>
                <button id="downloadBtn" class="btn">사진으로 저장</button>
            </section>

            <div class="waiting">
                <h2 class="waiting-title">대기 중 <span id="waitingCount"></span></h2>
                <div id="unassignedList" class="unassigned-list">
                    <div class="empty-list-msg">파일을 올리면<br>명단이 여기에 붙어요.</div>
                </div>
                <p class="note">포스트잇을 끌어서 자리에 붙여요.<br>자리를 누르면 다시 여기로 돌아와요.</p>
            </div>
        </aside>

        <main class="sheet main-sheet">
            <div class="tape tape-pink"></div>
            <section class="classroom">
                <header class="room-head">
                    <h1><mark>강원사대부고</mark> 자리바꾸기</h1>
                    <span class="room-date" id="roomDate"></span>
                </header>
                <div class="seating-grid" id="seatingGrid">
                    <!-- Seats will be generated here -->
                    <div class="empty-state">파일을 올리고<br>'두근두근 배치!'를 눌러 주세요</div>
                </div>
                <p class="edit-hint">칸을 눌러 책상을 놓거나 빼요. 다 고쳤으면 '고치기 끝'을 눌러 주세요.</p>
                <div class="teacher-desk">교탁</div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
