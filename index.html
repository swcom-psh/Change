<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자리바꾸기 프로그램</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Neo-Brutalism vibe -->
    <link
        href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="main-header">
            <h1>자리바꾸기 프로그램</h1>
        </header>

        <section class="controls">
            <div class="control-card">
                <h2>1. 데이터 업로드</h2>
                <input type="file" id="csvInput" accept=".csv, .xlsx, .xls">
                <p class="help-text">CSV 또는 엑셀(.xlsx) 파일을 선택해주세요. (선택 안 하면 샘플 데이터 사용)</p>
            </div>
            <div class="control-card">
                <h2>2. 배치 실행</h2>
                <div class="button-group">
                    <button id="generateBtn" class="btn-primary">자리 배치하기</button>
                    <button id="editBtn" class="btn-info">자리 구조 수정</button>
                    <button id="downloadBtn" class="btn-secondary">이미지 저장</button>
                </div>
            </div>
        </section>

        <section class="classroom">
            <div class="seating-grid" id="seatingGrid">
                <!-- Seats will be generated here -->
                <div class="empty-state">파일을 업로드하거나<br>바로 '자리 배치하기'를 눌러주세요!</div>
            </div>
            <div class="teacher-desk">교탁</div>
            <div id="classroomObjects" class="classroom-objects"></div>
            <p class="edit-hint">※ '자리 구조 수정' 버튼을 누르면 자리를 직접 추가하거나 삭제할 수 있습니다.</p>
        </section>

        <section id="reportCard" class="report-card" style="display: none;">
            <h2>자리 배치 결과 리포트</h2>
            <div id="reportContent" class="report-grid"></div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
